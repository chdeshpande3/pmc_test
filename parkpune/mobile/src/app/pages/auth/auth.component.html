<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <mat-icon class="logo-icon">local_parking</mat-icon>
      <h1>ParkPune</h1>
      <p>Pune's smart parking finder</p>
    </div>

    <!-- Phone step -->
    <form *ngIf="step === 'phone'" [formGroup]="phoneForm" (ngSubmit)="sendOtp()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Mobile number</mat-label>
        <span matPrefix>+91 &nbsp;</span>
        <input matInput formControlName="phone" type="tel" maxlength="10"
               placeholder="9876543210" inputmode="numeric">
        <mat-error *ngIf="phoneForm.get('phone')?.hasError('pattern')">
          Enter a valid 10-digit Indian mobile number
        </mat-error>
      </mat-form-field>

      <button mat-flat-button color="primary" type="submit" class="submit-btn"
              [disabled]="phoneForm.invalid || submitting">
        <mat-spinner diameter="20" *ngIf="submitting"></mat-spinner>
        <span *ngIf="!submitting">Send OTP via WhatsApp</span>
      </button>

      <p class="hint">We'll send a one-time password to your WhatsApp number.</p>
    </form>

    <!-- OTP step -->
    <form *ngIf="step === 'otp'" [formGroup]="otpForm" (ngSubmit)="verifyOtp()">
      <p class="otp-sent">OTP sent to WhatsApp for <strong>+91 {{ phone }}</strong></p>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Enter OTP</mat-label>
        <input matInput formControlName="otp" type="text" maxlength="6"
               placeholder="123456" inputmode="numeric" autocomplete="one-time-code">
        <mat-error *ngIf="otpForm.get('otp')?.invalid">Enter 6-digit OTP</mat-error>
      </mat-form-field>

      <button mat-flat-button color="primary" type="submit" class="submit-btn"
              [disabled]="otpForm.invalid || submitting">
        <mat-spinner diameter="20" *ngIf="submitting"></mat-spinner>
        <span *ngIf="!submitting">Verify & Login</span>
      </button>

      <button mat-button type="button" (click)="step = 'phone'" class="back-link">
        ← Change number
      </button>
    </form>
  </div>
</div>
